title: AegisPub
tagline: "Cybersecurity · Technology · Society"
description: "Independent cybersecurity and technology publication."
url: "https://aegispub.com"
baseurl: ""
email: contactaegispub@gmail.com

twitter:
  username: AegisPub
  card: summary_large_image

# Sitewide og:image fallback used by jekyll-seo-tag when a page/post has no
# `image:` of its own. Sized 1200x630 to meet Open Graph / Twitter card
# minimums — do not point this back at the 192x192 masthead logo.
logo: /assets/img/og-default.png

# Authoring
timezone: America/New_York

# Permalinks
permalink: /post/:slug/

# Archive plugin
archive_period: quarterly

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# jekyll-feed
feed:
  path: feed.xml

# Build settings
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - vendor/

# Collections
# Posts are standard Jekyll — no custom collection needed

# Sass
sass:
  style: compressed

# Content copyright
author:
  name: AegisPub
  email: contactaegispub@gmail.com
